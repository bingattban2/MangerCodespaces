<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self';" />
<title>التمام اليومي — تسجيل الدخول (Login)</title>
<link rel="stylesheet" href="../../../assets/css/altamam.css" /><link rel="stylesheet" href="../../../assets/css/presentation.css" /><link rel="stylesheet" href="../../../assets/css/auth.css" />
</head><body class="altamam-screen-module" data-route-key="Login" dir="rtl">
<header class="app-topbar"><div class="brand-cluster"><div class="brand-logo">ت</div><div><div class="brand-title">التمام اليومي — تسجيل الدخول</div><div class="brand-subtitle">إدارة القوة والتحضير</div></div></div><span class="badge-pill">يعمل بدون إنترنت</span></header>
<main class="app-main auth-layout"><article class="card" id="route-Login" data-bridge-mount="Login"><div class="card-header"><h1 class="page-title">تسجيل الدخول</h1><button id="refreshAuthentication" class="btn btn-outline" type="button">تحديث</button></div>
<form id="authenticationForm" class="auth-form"><div class="form-group"><label class="form-label" for="username">اسم المستخدم</label><input class="form-control" id="username" name="username" autocomplete="off" required maxlength="64" dir="ltr" /></div><div class="form-group"><label class="form-label" for="password">كلمة المرور</label><input class="form-control" id="password" name="password" type="password" autocomplete="off" required maxlength="256" /></div><div id="authenticationStatus" class="auth-status" role="status" aria-live="polite"></div><div class="auth-actions"><button class="btn btn-primary" type="submit">دخول</button></div></form>
</article></main><script src="../../../assets/js/bridge-client.js" defer></script><script src="../../../assets/js/auth-screen.js" defer></script></body></html>
