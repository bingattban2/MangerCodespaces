name: Windows Core Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-core:
    name: Build production libraries and Windows host
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore production solution
        shell: pwsh
        working-directory: source
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'step0104-build-evidence'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          & dotnet restore AlTamam.slnx -warnaserror *>&1 | Tee-Object -FilePath (Join-Path $evidence 'restore.log')
          $restoreExit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'restore.exitcode') -Value $restoreExit
          Write-Host "ACTUAL_WINDOWS_RESTORE_EXIT_CODE=$restoreExit"
          if ($restoreExit -ne 0) { throw "Production restore failed: exit $restoreExit" }
      - name: Compile Release with warnings as errors
        shell: pwsh
        working-directory: source
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'step0104-build-evidence'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          & dotnet build AlTamam.slnx --configuration Release --no-restore -warnaserror *>&1 | Tee-Object -FilePath (Join-Path $evidence 'release-build.log')
          $buildExit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'release-build.exitcode') -Value $buildExit
          Write-Host "ACTUAL_WINDOWS_BUILD_EXIT_CODE=$buildExit"
          if ($buildExit -ne 0) { throw "Production Release build failed: exit $buildExit" }
      - name: Verify real build outputs and block premature release
        shell: pwsh
        working-directory: source
        run: |
          $projects = @('Domain','Contracts','Application','Infrastructure')
          $projectFiles = @(Get-ChildItem src -File -Recurse -Filter '*.csproj')
          if ($projectFiles.Count -ne 5) {
            throw "Expected four production libraries and the authorized Windows host, found $($projectFiles.Count). Reevaluate executable gate before adding projects."
          }
          if (@($projectFiles | Where-Object { $_.FullName -match '(?i)[\\/](?:tests?|samples?|demos?|fixtures?)[\\/]|(?:test|sample|demo)[^\\/]*\.csproj$' }).Count -ne 0) {
            throw 'Test/sample project was found inside production source. Tests belong to private external workspace.'
          }
          foreach ($project in $projects) {
            $dll = "src/AlTamam.$project/bin/Release/net10.0/AlTamam.$project.dll"
            if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing compiled DLL: $dll" }
            if ((Get-Item -LiteralPath $dll).Length -le 1024) { throw "Invalid compiled DLL: $dll" }
          }
          $hosts = @()
          foreach ($file in (Get-ChildItem src -Recurse -File -Filter '*.csproj')) {
            [xml]$project = Get-Content -LiteralPath $file.FullName -Raw
            $output = $project.SelectSingleNode('/Project/PropertyGroup/OutputType')
            if ($null -ne $output -and $output.InnerText -in @('Exe','WinExe')) { $hosts += $file.FullName }
          }
          if ($hosts.Count -ne 1 -or $hosts[0] -notmatch 'AlTamam.Desktop') { throw 'Expected exactly the reviewed Windows Desktop host' }
          $app='src/AlTamam.Desktop/bin/Release/net10.0-windows/AlTamam.exe'
          if(-not(Test-Path $app -PathType Leaf)){throw 'The WPF Windows executable was not built'}
          Write-Host 'EXECUTABLE_HOST_BUILT: runtime and distribution require their own comprehensive gates.'
          Write-Host 'APPLICATION_RELEASE_ELIGIBLE=false'
          Write-Host 'FOUR_PRODUCTION_DLLS_VERIFIED=true'
      - name: Upload Windows restore and build evidence (never an application release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-build-evidence
          path: step0104-build-evidence/
          if-no-files-found: warn

  external-verification:
    name: Verify current source with isolated CSharp and SQLCipher suite
    needs: compile-core
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact production revision
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require read-only access to private verification repository
        shell: pwsh
        env:
          PRIVATE_VERIFIER_READ_TOKEN: ${{ secrets.ALTAMAM_VERIFIER_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_VERIFIER_READ_TOKEN)) {
            throw 'Missing ALTAMAM_VERIFIER_READ_TOKEN. Create a fine-grained token restricted to private AlTamam-External-Verification with Contents: Read-only and store it as a production Actions secret. The gate must not be skipped.'
          }
      - name: Checkout independently reviewed external verification
        uses: actions/checkout@v4
        with:
          repository: bingattban2/AlTamam-External-Verification
          ref: 65325b93807c272973e26411e0b1a3eaa7d228bd
          token: ${{ secrets.ALTAMAM_VERIFIER_READ_TOKEN }}
          path: verifier
          persist-credentials: false
      - name: Install .NET 10 for independent tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute all inherited real domain and SQLCipher regressions
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $output = Join-Path $env:GITHUB_WORKSPACE 'independent-evidence'
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Production checkout lacks a valid source SHA' }
          Write-Host "VERIFIED_PRODUCTION_SHA=$sha"
          $approvedVerifier = (& git -C $verifier rev-parse HEAD).Trim()
          if ($approvedVerifier -ne '65325b93807c272973e26411e0b1a3eaa7d228bd') { throw 'External verifier checkout does not match approved SHA' }
          & (Join-Path $verifier 'verify_phase01_current_regression.ps1') -RepositoryRoot $source -ResultsDirectory $output -ExpectedCommit $sha
          if ($LASTEXITCODE -ne 0) { throw "Current production regression failed: exit $LASTEXITCODE" }
      - name: Reverify project graph and conservative cleanup independently
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $output = Join-Path $env:GITHUB_WORKSPACE 'independent-graph-evidence'
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Invalid production SHA for independent graph audit' }
          & (Join-Path $verifier 'verify_phase01_graph.ps1') -RepositoryRoot $source -ResultsDirectory $output -ExpectedCommit $sha
          if ($LASTEXITCODE -ne 0) { throw "Independent project graph or cleanup failed: exit $LASTEXITCODE" }
      - name: Verify SQLCipher historical identity API (Phase 02.01 diagnostic)
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out = Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($out) | Out-Null
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Invalid exact production SHA for Phase02 diagnostics' }
          $env:AlTamamRepoRoot = $source
          $runner = Join-Path $verifier 'Phase02IdentityRunner/Phase02IdentityRunner.csproj'
          & dotnet run --project $runner --configuration Release -- (Join-Path $out 'identity-results.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'identity-runtime.log')
          $exit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $out 'identity-process.exitcode') -Value $exit
          if ($exit -ne 0) { throw "Real SQLCipher identity diagnostic failed: $exit" }
          $proof = Get-Content -LiteralPath (Join-Path $out 'identity-results.json') -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS' -or $proof.productionCommit -ne $sha -or
              @($proof.checks).Count -lt 20 -or @($proof.failures).Count -gt 0) {
            throw 'Missing positive and negative persisted-state identity evidence'
          }
          $mandatory = @(
            'Historical monthly API is immutable after person/site/status display edits',
            'Explicit ValidTo terminates the as-of interval without current-label fallback',
            'Reopen SQLCipher preserves historical monthly API snapshots',
            'Same requestId with changed reason is not accepted as original',
            'Active service number duplicate rolls back',
            'Unauthorized session cannot mutate person'
          )
          foreach($name in $mandatory) {
            $matching = @($proof.checks | Where-Object { $_.name -eq $name -and $_.pass -eq $true })
            if ($matching.Count -ne 1) { throw "Missing required 02.01 acceptance assertion: $name" }
          }
          Write-Host "PHASE02_STEP0201_EXTERNAL=PASS; source=$sha; checked=$(@($proof.checks).Count); phaseGate=NOT_RUN"
      - name: Reject unverified subprocess restart, concurrency or partial SQL transactions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out = Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($out) | Out-Null
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Invalid source SHA for 02.01 resilience' }
          $env:AlTamamRepoRoot = $source
          $project = Join-Path $verifier 'Phase02IdentityResilienceRunner/Phase02IdentityResilienceRunner.csproj'
          & dotnet run --project $project -c Release -- (Join-Path $out 'resilience-results.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'resilience-runtime.log')
          $exit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $out 'resilience-process.exitcode') -Value $exit
          if ($exit -ne 0) { throw "Actual SQLCipher resilience runner rejected; exit=$exit" }
          $proof = Get-Content -LiteralPath (Join-Path $out 'resilience-results.json') -Raw | ConvertFrom-Json
          if ($proof.status -ne 'PASS' -or $proof.productionSha -ne $sha -or
              @($proof.checks).Count -lt 12 -or @($proof.failures).Count -ne 0) {
            throw 'Missing independent process/concurrency/rollback typed-failure evidence'
          }
          foreach($name in @(
            'New OS process reopens encrypted database and replays request without duplication',
            'Injected fault rolls back person, history and original audit atomically',
            'Two concurrent independent database handles allow exactly one identity commit',
            'Concurrent loser cannot create history, duplicate audit or stale final name',
            'Wrong SQLCipher key causes typed ReadAsOf denial',
            'Wrong SQLCipher key causes typed monthly read denial',
            'Invalid encrypted schema returns typed ReadAsOf failure',
            'Invalid encrypted schema returns typed monthly failure')) {
            $hits = @($proof.checks | Where-Object { $_.name -eq $name -and $_.pass -eq $true })
            if ($hits.Count -ne 1) { throw "Required 02.01 resilience proof absent: $name" }
          }
          Write-Host "PHASE02_STEP0201_RESILIENCE_EXTERNAL=PASS; checks=$(@($proof.checks).Count); source=$sha; phaseGate=NOT_RUN"
      - name: Prove 02.02 stable IDs, FK denial, indexes, retained V001 and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier=Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($out) | Out-Null
          $sha=(& git -C $source rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $sha.Length -ne 40){throw 'Missing tested production SHA'}
          $env:AlTamamRepoRoot=$source
          $runner=Join-Path $verifier 'Phase02SchemaRunner/Phase02SchemaRunner.csproj'
          & dotnet run --project $runner -c Release -- (Join-Path $out 'schema-constraints.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'schema-constraints.log')
          $exit=[int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $out 'schema-constraints.exitcode') -Value $exit
          if($exit -ne 0){throw "Real SQLCipher 02.02 constraint verification failed: $exit"}
          $proof=Get-Content -LiteralPath (Join-Path $out 'schema-constraints.json') -Raw|ConvertFrom-Json
          if($proof.status -ne 'PASS' -or $proof.productionSha -ne $sha -or
             @($proof.checks).Count -lt 49 -or @($proof.failures).Count -ne 0) {
             throw 'Missing committed SQLCipher schema and deletion-denial evidence'
          }
          foreach($name in @(
            'Immutable PersonId denied even for referenced person',
            'Immutable SiteId denied',
            'Committed attendance cannot be deleted',
            'Historic identity row cannot be deleted',
            'Unknown SourceMovementId rejected',
            'Wrong attendance assignment-person/site combination rejected',
            'Existing V001 orphan blocks hardening and preserves original row',
            'Existing clean V001 upgraded idempotently without schema-version rewrite',
            'Real SQLite foreign_key_check reports zero orphans',
            'Close and reopen SQLCipher retains constraints and rows',
            'Immutable assignment site prevents redirecting old attendance',
            'Revision links forbid deleting referenced status without its own history',
            'Historic role change cannot be deleted',
            'Malformed JSON draft person list rejected',
            'JSON draft person list must reference stable existing PersonId',
            'Person delete rejected when referenced only in draft person JSON')) {
            $matches=@($proof.checks|Where-Object{$_.name -eq $name -and $_.pass -eq $true})
            if($matches.Count -ne 1){throw "Required 02.02 assertion missing: $name"}
          }
          Write-Host "PHASE02_STEP0202_EXTERNAL=PASS; checks=$(@($proof.checks).Count); source=$sha; phaseGate=NOT_RUN"
      - name: Compile external schema process-isolation fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:AlTamamRepoRoot=Join-Path $env:GITHUB_WORKSPACE 'source'
          $project=Join-Path $env:GITHUB_WORKSPACE 'verifier/Phase02SchemaProcessRunner/Phase02SchemaProcessRunner.csproj'
          $output=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($output) | Out-Null
          & dotnet build $project -c Release -warnaserror *>&1 | Tee-Object -FilePath (Join-Path $output 'process-runner-build.log')
          if ($LASTEXITCODE -ne 0) { throw 'External process-isolation test did not compile' }
      - name: Prove 02.02 persists across terminated processes, with rollback and idempotency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $project=Join-Path $env:GITHUB_WORKSPACE 'verifier/Phase02SchemaProcessRunner/Phase02SchemaProcessRunner.csproj'
          $output=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          $env:AlTamamRepoRoot=$source
          $sha=(& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Exact source revision absent' }
          $db=Join-Path $env:RUNNER_TEMP ('phase0202-restart-'+[guid]::NewGuid().ToString('N')+'.db')
          $env:ALTAMAM_SCHEMA_TEST_KEY=[Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $proof=@()
          try {
            $steps=@('seed','reopen','rollback','reopen')
            for ($i=0; $i -lt $steps.Count; $i++) {
              $phase=$steps[$i]
              $log=Join-Path $output ("fresh-process-$i-$phase.log")
              & dotnet run --no-build --project $project -c Release -- $phase $db *>&1 |
                Tee-Object -FilePath $log
              $exit=[int]$LASTEXITCODE
              if ($exit -ne 0) { throw "Step $i ($phase) failed with process exit code $exit" }
              $matchingLines=@(Get-Content $log | Where-Object {
                $_.Trim() -match "^SCHEMA_RESTART_STEP=$phase;pid=[0-9]+;pass=PASS$"
              })
              if ($matchingLines.Count -ne 1) { throw "Missing independent process proof for step $i ($phase)" }
              $pidText=([regex]::Match($matchingLines[0],';pid=([0-9]+);')).Groups[1].Value
              $proof+=@{phase=$phase;processId=[int]$pidText;exitCode=$exit}
            }
            if ((@($proof | Select-Object -ExpandProperty processId -Unique)).Count -ne 4) {
              throw 'All four persist/reopen/rollback/reopen invocations must use distinct OS processes'
            }
            [ordered]@{
              productionSha=$sha
              result='PASS'
              terminatedSeparateProcesses=$true
              phases=$proof
              duplicateRequestAndTransactionRollbackVerified=$true
              phase02ComprehensiveGate='NOT_RUN'
            } | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $output 'independent-process-restart.json')
            Write-Host "PHASE02_STEP0202_PROCESS_RESTART=PASS; stages=4; source=$sha; phaseGate=NOT_RUN"
          } finally {
            Remove-Item Env:ALTAMAM_SCHEMA_TEST_KEY -ErrorAction SilentlyContinue
            foreach($suffix in @('','-wal','-shm')) {
              Remove-Item -LiteralPath ($db+$suffix) -ErrorAction SilentlyContinue
            }
          }
      - name: Enforce 02.03 half-open SQLCipher temporal interval acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier=Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($out)|Out-Null
          $sha=(& git -C $source rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $sha.Length -ne 40){throw 'Missing source commit SHA'}
          $env:AlTamamRepoRoot=$source
          $runner=Join-Path $verifier 'Phase02TemporalRunner/Phase02TemporalRunner.csproj'
          & dotnet run --project $runner -c Release -- (Join-Path $out 'temporal-results.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'temporal-runtime.log')
          $exit=[int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $out 'temporal-exitcode.txt') -Value $exit
          if($exit -ne 0){throw "02.03 temporal SQLCipher acceptance rejected: $exit"}
          $proof=Get-Content (Join-Path $out 'temporal-results.json') -Raw|ConvertFrom-Json
          if($proof.status -ne 'PASS' -or $proof.sourceSha -ne $sha -or
             @($proof.cases).Count -lt 28 -or @($proof.failures).Count -ne 0) {
            throw 'Missing actual SQLCipher temporal acceptance evidence'
          }
          foreach($name in @(
            'Adjacent identity, site, status, assignment intervals and two distinct attendance dates persist',
            'Overlapping identity INSERT rejected',
            'Identity UPDATE end beyond next start rejected',
            'Overlapping site name INSERT rejected',
            'Overlapping status INSERT rejected',
            'Overlapping assignment INSERT rejected',
            'Second committed status for person on same date denied',
            'Attendance outside effective assignment interval denied',
            'Two-row transaction aborts after valid first insert with no partial history',
            'Concurrent overlapping assignments produce one committed winner',
            'Shortening assignment before committed attendance day is rejected',
            'Moving assignment start after committed attendance day is rejected',
            'Rejected interval edit keeps both assignments and historical attendance unchanged',
            'Rollback of prior permitted interval edit after later history-invalidating change',
            'Valid assignment closure after last committed attendance is allowed',
            'Fresh Windows process reopens persisted temporal constraints',
            'Overlapping legacy V001 history fails closed without rewriting historical rows')) {
            $hits=@($proof.cases|Where-Object{$_.name -eq $name -and $_.pass -eq $true})
            if($hits.Count -ne 1){throw "Required 02.03 persisted case not met: $name"}
          }
          Write-Host "PHASE02_STEP0203_EXTERNAL=PASS; checks=$(@($proof.cases).Count); source=$sha; phaseGate=NOT_RUN"
      - name: Verify encryption keys and safe migrations in final Phase 02 gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier=Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          [IO.Directory]::CreateDirectory($out)|Out-Null
          $sha=(& git -C $source rev-parse HEAD).Trim()
          $env:AlTamamRepoRoot=$source
          $runner=Join-Path $verifier 'Phase02SecurityMigrationRunner/Phase02SecurityMigrationRunner.csproj'
          & dotnet run --project $runner -c Release -- (Join-Path $out 'security-migrations.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'security-migrations.log')
          if($LASTEXITCODE -ne 0){throw 'Encryption key or safe migration acceptance failed'}
          $proof=Get-Content (Join-Path $out 'security-migrations.json') -Raw|ConvertFrom-Json
          if($proof.status -ne 'PASS' -or $proof.sourceSha -ne $sha -or
             @($proof.cases).Count -ne 15 -or @($proof.failures).Count -ne 0){
            throw 'Missing real Windows DPAPI and encrypted recovery evidence'
          }
          Write-Host "PHASE02_SECURITY_MIGRATIONS=PASS; source=$sha; cases=15"
      - name: Consolidate single comprehensive Phase 02 acceptance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase02-evidence'
          $sha=(& git -C $source rev-parse HEAD).Trim()
          $specs=@(
            @('identity-results.json','productionCommit','status','PASS'),
            @('resilience-results.json','productionSha','status','PASS'),
            @('schema-constraints.json','productionSha','status','PASS'),
            @('temporal-results.json','sourceSha','status','PASS'),
            @('security-migrations.json','sourceSha','status','PASS'),
            @('independent-process-restart.json','productionSha','result','PASS')
          )
          $components=@()
          foreach($spec in $specs){
            $proof=Get-Content (Join-Path $out $spec[0]) -Raw|ConvertFrom-Json
            if($proof.($spec[1]) -ne $sha -or $proof.($spec[2]) -ne $spec[3]){
              throw "Phase 02 comprehensive gate rejected component $($spec[0])"
            }
            $components+=@{file=$spec[0];result='PASS';sourceSha=$sha}
          }
          [ordered]@{
            phase='02';status='PASS';productionSha=$sha
            components=$components
            windowsRestoreAndBuild='PASS'
            inheritedRegressionAndProjectGraph='PASS'
            uiChanges='NONE; Phase 02 owns no screens'
            applicationReleaseEligible=$false
          }|ConvertTo-Json -Depth 6|Set-Content (Join-Path $out 'phase02-comprehensive.json')
          Write-Host "PHASE02_COMPREHENSIVE_EXTERNAL=PASS; source=$sha"
      - name: Run single comprehensive Phase 03 authentication acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier=Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase03-evidence'
          [IO.Directory]::CreateDirectory($out)|Out-Null
          $sha=(& git -C $source rev-parse HEAD).Trim()
          $env:AlTamamRepoRoot=$source
          $runner=Join-Path $verifier 'Phase03AuthenticationRunner/Phase03AuthenticationRunner.csproj'
          & dotnet run --project $runner -c Release -- (Join-Path $out 'phase03-comprehensive.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'phase03-comprehensive.log')
          if($LASTEXITCODE -ne 0){throw 'Phase 03 authentication acceptance failed'}
          $proof=Get-Content (Join-Path $out 'phase03-comprehensive.json') -Raw|ConvertFrom-Json
          if($proof.status -ne 'PASS' -or $proof.sourceSha -ne $sha -or
             $proof.isWindows -ne $true -or @($proof.checks).Count -ne 29 -or @($proof.failures).Count -ne 0){
            throw 'Missing exact-commit persisted authentication and permission evidence'
          }
          Write-Host "PHASE03_COMPREHENSIVE_EXTERNAL=PASS; source=$sha; cases=29"
      - name: Run single comprehensive Phase 04 real Windows desktop acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier=Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $out=Join-Path $env:GITHUB_WORKSPACE 'independent-phase04-evidence'
          [IO.Directory]::CreateDirectory($out)|Out-Null
          $sha=(& git -C $source rev-parse HEAD).Trim()
          $env:AlTamamRepoRoot=$source
          $runner=Join-Path $verifier 'Phase04DesktopRunner/Phase04DesktopRunner.csproj'
          & dotnet run --project $runner -c Release -- (Join-Path $out 'phase04-comprehensive.json') $sha *>&1 |
            Tee-Object -FilePath (Join-Path $out 'phase04-comprehensive.log')
          if($LASTEXITCODE -ne 0){throw 'Phase 04 actual Windows desktop verification failed'}
          $proof=Get-Content (Join-Path $out 'phase04-comprehensive.json') -Raw|ConvertFrom-Json
          if($proof.status -ne 'PASS' -or $proof.sourceSha -ne $sha -or
             $proof.isWindows -ne $true -or @($proof.checks).Count -ne 27 -or @($proof.failures).Count -ne 0){
