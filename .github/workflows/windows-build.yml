name: Windows Core Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-core:
    name: Build four production libraries
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore production solution
        shell: pwsh
        working-directory: source
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'step0104-build-evidence'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          & dotnet restore AlTamam.slnx -warnaserror *>&1 | Tee-Object -FilePath (Join-Path $evidence 'restore.log')
          $restoreExit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'restore.exitcode') -Value $restoreExit
          Write-Host "ACTUAL_WINDOWS_RESTORE_EXIT_CODE=$restoreExit"
          if ($restoreExit -ne 0) { throw "Production restore failed: exit $restoreExit" }
      - name: Compile Release with warnings as errors
        shell: pwsh
        working-directory: source
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'step0104-build-evidence'
          [IO.Directory]::CreateDirectory($evidence) | Out-Null
          & dotnet build AlTamam.slnx --configuration Release --no-restore -warnaserror *>&1 | Tee-Object -FilePath (Join-Path $evidence 'release-build.log')
          $buildExit = [int]$LASTEXITCODE
          Set-Content -LiteralPath (Join-Path $evidence 'release-build.exitcode') -Value $buildExit
          Write-Host "ACTUAL_WINDOWS_BUILD_EXIT_CODE=$buildExit"
          if ($buildExit -ne 0) { throw "Production Release build failed: exit $buildExit" }
      - name: Verify real build outputs and block premature release
        shell: pwsh
        working-directory: source
        run: |
          $projects = @('Domain','Contracts','Application','Infrastructure')
          $projectFiles = @(Get-ChildItem src -File -Recurse -Filter '*.csproj')
          if ($projectFiles.Count -ne 4) {
            throw "Expected four production class libraries, found $($projectFiles.Count). Reevaluate executable gate before adding projects."
          }
          if (@($projectFiles | Where-Object { $_.FullName -match '(?i)[\\/](?:tests?|samples?|demos?|fixtures?)[\\/]|(?:test|sample|demo)[^\\/]*\.csproj$' }).Count -ne 0) {
            throw 'Test/sample project was found inside production source. Tests belong to private external workspace.'
          }
          foreach ($project in $projects) {
            $dll = "src/AlTamam.$project/bin/Release/net10.0/AlTamam.$project.dll"
            if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) { throw "Missing compiled DLL: $dll" }
            if ((Get-Item -LiteralPath $dll).Length -le 1024) { throw "Invalid compiled DLL: $dll" }
          }
          $hosts = @()
          foreach ($file in (Get-ChildItem src -Recurse -File -Filter '*.csproj')) {
            [xml]$project = Get-Content -LiteralPath $file.FullName -Raw
            $output = $project.SelectSingleNode('/Project/PropertyGroup/OutputType')
            if ($null -ne $output -and $output.InnerText -in @('Exe','WinExe')) { $hosts += $file.FullName }
          }
          if ($hosts.Count -eq 0) {
            $executables = @(Get-ChildItem src -Recurse -File -Filter '*.exe')
            if ($executables.Count -gt 0) { throw 'Executable artifact exists without an executable host project; release eligibility is invalid.' }
            Write-Host 'NO_EXECUTABLE_HOST: This CI only compiles libraries.'
          } else {
            Write-Host 'EXECUTABLE_HOST_PROJECT_DETECTED: A future separately reviewed packaging/release gate is required.'
          }
          Write-Host 'APPLICATION_RELEASE_ELIGIBLE=false'
          Write-Host 'FOUR_PRODUCTION_DLLS_VERIFIED=true'
      - name: Upload Windows restore and build evidence (never an application release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-build-evidence
          path: step0104-build-evidence/
          if-no-files-found: warn

  external-verification:
    name: Verify current source with isolated CSharp and SQLCipher suite
    needs: compile-core
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact production revision
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Require read-only access to private verification repository
        shell: pwsh
        env:
          PRIVATE_VERIFIER_READ_TOKEN: ${{ secrets.ALTAMAM_VERIFIER_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_VERIFIER_READ_TOKEN)) {
            throw 'Missing ALTAMAM_VERIFIER_READ_TOKEN. Create a fine-grained token restricted to private AlTamam-External-Verification with Contents: Read-only and store it as a production Actions secret. The gate must not be skipped.'
          }
      - name: Checkout independently reviewed external verification
        uses: actions/checkout@v4
        with:
          repository: bingattban2/AlTamam-External-Verification
          ref: e2c351518b0e94da4d333e795e0ddf78cf429622
          token: ${{ secrets.ALTAMAM_VERIFIER_READ_TOKEN }}
          path: verifier
          persist-credentials: false
      - name: Install .NET 10 for independent tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Execute all inherited real domain and SQLCipher regressions
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $output = Join-Path $env:GITHUB_WORKSPACE 'independent-evidence'
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Production checkout lacks a valid source SHA' }
          Write-Host "VERIFIED_PRODUCTION_SHA=$sha"
          $approvedVerifier = (& git -C $verifier rev-parse HEAD).Trim()
          if ($approvedVerifier -ne 'e2c351518b0e94da4d333e795e0ddf78cf429622') { throw 'External verifier checkout does not match approved SHA' }
          & (Join-Path $verifier 'verify_phase01_current_regression.ps1') -RepositoryRoot $source -ResultsDirectory $output -ExpectedCommit $sha
          if ($LASTEXITCODE -ne 0) { throw "Current production regression failed: exit $LASTEXITCODE" }
      - name: Reverify project graph and conservative cleanup independently
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'source'
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'verifier'
          $output = Join-Path $env:GITHUB_WORKSPACE 'independent-graph-evidence'
          $sha = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha.Length -ne 40) { throw 'Invalid production SHA for independent graph audit' }
          & (Join-Path $verifier 'verify_phase01_graph.ps1') -RepositoryRoot $source -ResultsDirectory $output -ExpectedCommit $sha
          if ($LASTEXITCODE -ne 0) { throw "Independent project graph or cleanup failed: exit $LASTEXITCODE" }
      - name: Upload isolated verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-production-independent-verification
          path: |
            independent-evidence/
            independent-graph-evidence/
          if-no-files-found: warn
